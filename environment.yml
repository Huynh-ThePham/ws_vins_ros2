# Conda alternative to requirements-lock.txt (plan P1.10). Prefer Dockerfile.paper
# for a publication run: it pins the OS and the ROS distro as well.
name: sem-geodf-paper
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip=24.0
  - numpy=1.26.4
  - scipy=1.15.3
  - matplotlib=3.10.8
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - pip:
      - ultralytics==8.4.61
      - opencv-python==4.11.0
