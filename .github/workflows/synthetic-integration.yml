name: synthetic-integration

# Plan section 9: a mini synthetic sequence with no GPU and no large dataset.
# Covers the decision-layer scenarios the plan lists (static scene, movers at 10% and
# 60%, stale mask, low parallax, aggressive rotation, near-minimum feature count,
# wrong-sign stereo matches) plus the weighted-factor gradient checks.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  synthetic:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake libeigen3-dev libceres-dev libboost-all-dev \
            libopencv-dev python3-colcon-common-extensions ros-humble-cv-bridge

      - name: Build and run the synthetic + gradient tests
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/humble/setup.bash
          colcon build --packages-up-to pht_vio --cmake-args -DBUILD_TESTING=ON
          cd build/pht_vio
          ctest --output-on-failure -R \
            'synthetic_integration|stereo_validity|sem_geodf|geodf_degeneracy|failure_detection|gradient|marginalization'
