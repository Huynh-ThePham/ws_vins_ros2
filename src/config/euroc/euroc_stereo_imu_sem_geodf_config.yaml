%YAML:1.0

# Semantic–GeoDF fusion (exp/sem-geodf-gated): scene-gated OR reject.
# Run: ros2 launch pht_vio_ros euroc_stereo_imu_sem_geodf.launch.py

imu: 1
num_of_cam: 2

imu_topic: "/imu0"
image0_topic: "/cam0/image_raw"
image1_topic: "/cam1/image_raw"
output_path: "~/output/"

cam0_calib: "cam0_mei.yaml"
cam1_calib: "cam1_mei.yaml"
image_width: 752
image_height: 480

estimate_extrinsic: 0

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975,
           0.999557249008, 0.0149672133247, 0.025715529948,  -0.064676986768,
           -0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949,
           0, 0, 0, 1]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0.0125552670891, -0.999755099723, 0.0182237714554, -0.0198435579556,
           0.999598781151, 0.0130119051815, 0.0251588363115, 0.0453689425024,
          -0.0253898008918, 0.0179005838253, 0.999517347078, 0.00786212447038,
          0, 0, 0, 1]

multiple_thread: 1

max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 1
flow_back: 1

# SAD-VINS semantic mask (cam0)
sem_enable: 1
sem_mask_topic: "/dynamic_mask"
sem_static_value: 255
sem_geodf_fusion: 1
sem_activate_ratio: 0.015
sem_activate_ema: 0.15
sem_deactivate_frac: 0.6
sem_mask_gated: 0
sem_vote_frames: 2
sem_adaptive_policy: 1
sem_policy_dynamic_level: -1
# Defaults synced to results/sem_policy_tuning_postfix/selected_params.yaml
# (thresholds selected on VIODE city_day train only). The paper runs load these
# selected values; keeping the defaults identical avoids reproduction drift.
sem_policy_burst_ratio: 0.18
sem_policy_strong_ratio: 0.18
sem_policy_hold_frames: 180
sem_policy_overlap_ratio: 0.35
sem_policy_overlap_ema: 0.20
sem_policy_min_geo_candidates: 2
# Online adaptive consensus residual weighting. Inputs are current semantic mask,
# GeoDF epipolar evidence, online EMA/gates, and temporal vote state only.
# No GT, scene label, ATE, or holdout result is read by the estimator.
sem_geodf_backend_weight: 1
sem_geodf_backend_min_weight: 0.25
sem_geodf_backend_semantic_weight: 0.55
sem_geodf_backend_geo_weight: 0.75
sem_geodf_backend_agree_weight: 0.25
sem_geodf_backend_recovery: 0.20
# Use the fused online risk, rather than mixing a synthetic semantic score with
# Sampson distance, when candidates compete for the shared rejection budget.
sem_geodf_rank_by_risk: 1
sem_mask_max_age_ms: 150.0
sem_use_latest_mask: 1
sem_block_on_mask: 0

# GeoDF-Adaptive geometry filter
geodf_enable: 1
geodf_hard_reject: 1
geodf_ransac_th_px: 1.0
geodf_sampson_th: 3.0
geodf_min_track_cnt: 2
geodf_min_feature_num: 40
geodf_reject_ratio_max: 0.40
geodf_ratio_guard: 1
geodf_debug: 1
geodf_dump_features: 0
geodf_adaptive: 1
geodf_activate_ratio: 0.12
geodf_activate_ema: 0.15
geodf_deactivate_frac: 0.6
geodf_auto_rho: 1
geodf_auto_mult: 1.8
geodf_auto_margin: 0.05
geodf_activate_ratio_min: 0.10
geodf_activate_ratio_max: 0.40
geodf_auto_floor_down: 0.02
geodf_auto_floor_up: 0.004
geodf_vote_frames: 2
geodf_warmup_frames: 30
geodf_stereo_check: 0
geodf_stereo_sampson_th: 6.0
geodf_stereo_floor_max: 0.045

max_solver_time: 0.04
max_num_iterations: 8
# Reprojection standard deviation in pixels and Huber transition after
# whitening. Defaults reproduce the original fixed constants.
visual_sigma_px: 1.5
visual_huber_delta: 1.0
# Observation-level information scaling from LK error, forward-backward
# consistency and temporal track maturity.
visual_adaptive_quality: 1
visual_quality_min_weight: 0.35
visual_lk_error_scale: 20.0
visual_fb_error_scale: 0.5
visual_quality_full_age: 4
# Learn a bounded Huber transition from the previous optimized window.
visual_adaptive_huber: 0
visual_huber_delta_min: 0.75
visual_huber_delta_max: 3.0
visual_huber_k: 1.345
visual_huber_ema: 0.10
visual_huber_min_samples: 30
keyframe_parallax: 10.0

acc_n: 0.1
gyr_n: 0.01
acc_w: 0.001
gyr_w: 0.0001
# Inflate IMU process noise only on clear transport/saturation degradation.
imu_adaptive_covariance: 1
imu_gap_threshold_s: 0.015
imu_acc_saturation: 80.0
imu_gyr_saturation: 8.0
imu_gap_inflation_gain: 3.0
imu_saturation_inflation_gain: 10.0
imu_max_cov_inflation: 20.0
g_norm: 9.81007

# Dormant while estimate_extrinsic/estimate_td are zero; protects future online
# calibration from opening in a weakly observable window.
calibration_observability_gate: 1
calibration_min_speed: 0.20
calibration_min_parallax_px: 5.0
calibration_min_tracked_features: 40
estimate_td: 0
td: 0.0

load_previous_pose_graph: 0
pose_graph_save_path: "~/output/pose_graph/"
save_image: 1
